<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Raffle winners</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #12121f;
    --panel: #1a1a2e;
    --panel-2: #20203a;
    --line: rgba(255,255,255,0.08);
    --text: #f2f2f7;
    --muted: rgba(242,242,247,0.55);
    --gold: #ffe566;
    --accent: #ff2d55;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background:
      radial-gradient(1100px 600px at 50% -10%, #2a2a4a 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font: 400 16px/1.5 Outfit, system-ui, sans-serif;
    min-height: 100vh;
    padding: 40px 20px 64px;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 28px; }
  h1 {
    font-weight: 800;
    font-size: 32px;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  h1 .dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 12px var(--accent);
    flex: none;
  }
  .sub { color: var(--muted); font-size: 14px; margin-top: 6px; }
  .stats { display: flex; gap: 12px; flex-wrap: wrap; margin: 22px 0 18px; }
  .stat {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px 18px;
    min-width: 120px;
  }
  .stat b { display: block; font-size: 26px; font-weight: 800; line-height: 1.2; }
  .stat span { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
  }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 14px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--panel-2);
    white-space: nowrap;
  }
  td { padding: 14px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  .rank { color: var(--muted); font-variant-numeric: tabular-nums; width: 52px; }
  .rank.top { color: var(--gold); font-weight: 800; }
  .name { font-weight: 600; }
  .wins { font-weight: 800; font-variant-numeric: tabular-nums; color: var(--gold); width: 72px; }
  .when { color: var(--muted); font-size: 14px; white-space: nowrap; }
  .when b { display: block; color: var(--text); font-weight: 400; font-size: 15px; }
  .empty { padding: 44px 18px; text-align: center; color: var(--muted); }
  footer { margin-top: 18px; color: var(--muted); font-size: 12px; }
  code { background: rgba(255,255,255,0.07); padding: 2px 6px; border-radius: 5px; }
  @media (max-width: 520px) { body { padding: 24px 12px 48px; } h1 { font-size: 26px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>Raffle winners</h1>
    <div class="sub" id="sub">Loading…</div>
  </header>

  <div class="stats">
    <div class="stat"><b id="statPeople">–</b><span>Winners</span></div>
    <div class="stat"><b id="statDraws">–</b><span>Total draws</span></div>
    <div class="stat"><b id="statLast">–</b><span>Most recent</span></div>
  </div>

  <div class="card">
    <div class="scroll">
      <table>
        <thead>
          <tr><th class="rank">#</th><th>Name</th><th>Wins</th><th>Last won</th><th>First won</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>No winners yet — run <code>!drawraffle</code> to get started.</div>
  </div>

  <footer id="footer"></footer>
</div>

<script>
(function () {
  var rows = document.getElementById("rows");
  var empty = document.getElementById("empty");

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function absolute(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "unknown";
    return d.toLocaleString(undefined, {
      year: "numeric", month: "short", day: "numeric",
      hour: "2-digit", minute: "2-digit"
    });
  }

  function relative(iso) {
    var d = new Date(iso);
    if (isNaN(d.getTime())) return "";
    var secs = Math.round((Date.now() - d.getTime()) / 1000);
    if (secs < 45) return "just now";
    // [switch to the next unit above this many seconds, unit name, seconds per unit]
    var units = [
      [5400, "minute", 60],
      [129600, "hour", 3600],
      [604800, "day", 86400],
      [3024000, "week", 604800],
      [47336400, "month", 2629800],
      [Infinity, "year", 31557600]
    ];
    for (var i = 0; i < units.length; i++) {
      if (secs < units[i][0]) {
        var n = Math.max(1, Math.round(secs / units[i][2]));
        return n + " " + units[i][1] + (n === 1 ? "" : "s") + " ago";
      }
    }
    return "";
  }

  function render(data) {
    var winners = data.winners || [];
    document.getElementById("statPeople").textContent = winners.length;
    document.getElementById("statDraws").textContent = data.totalWins || 0;

    var newest = winners.slice().sort(function (a, b) {
      return b.lastWonAt.localeCompare(a.lastWonAt);
    })[0];
    document.getElementById("statLast").textContent = newest ? newest.name : "–";
    document.getElementById("sub").textContent = newest
      ? "Latest win " + relative(newest.lastWonAt) + " by " + newest.name
      : "Nobody has won yet.";
    var days = data.retentionDays;
    document.getElementById("footer").textContent =
      "Stored in " + (data.path || "database.json") + " · live-updates on every draw" +
      (days ? " · winners not seen in " + days + " day" + (days === 1 ? "" : "s") +
              " are cleared on restart" : "");

    empty.hidden = winners.length > 0;
    rows.innerHTML = winners.map(function (w, i) {
      return "<tr>" +
        '<td class="rank' + (i === 0 ? " top" : "") + '">' + (i + 1) + "</td>" +
        '<td class="name">' + esc(w.name) + "</td>" +
        '<td class="wins">' + w.wins + "</td>" +
        '<td class="when"><b>' + esc(relative(w.lastWonAt)) + "</b>" + esc(absolute(w.lastWonAt)) + "</td>" +
        '<td class="when">' + esc(absolute(w.firstWonAt)) + "</td>" +
        "</tr>";
    }).join("");
  }

  function load() {
    fetch("/api/history")
      .then(function (r) { return r.json(); })
      .then(render)
      .catch(function () {
        document.getElementById("sub").textContent = "Could not reach the bot.";
      });
  }

  load();
  // Refresh the "x ago" column without hammering the server.
  setInterval(load, 60000);

  var es = new EventSource("/api/events");
  es.addEventListener("draw", function () {
    // The wheel spins for ~5s before revealing; match that so the page and the
    // overlay announce the winner at the same moment.
    setTimeout(load, 5200);
  });
})();
</script>
</body>
</html>
