name: Build & release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # `pretypecheck` inlines the overlay HTML into src/server/assets.generated.ts
      - run: npm run typecheck

  build:
    name: Build ${{ matrix.name }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            target: bun-linux-x64
            ext: ""
          - name: linux-arm64
            target: bun-linux-arm64
            ext: ""
          - name: windows-x64
            target: bun-windows-x64
            ext: ".exe"
          - name: macos-x64
            target: bun-darwin-x64
            ext: ""
          - name: macos-arm64
            target: bun-darwin-arm64
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: npm ci

      - name: Inline overlay assets
        run: npm run gen:assets

      # Bun cross-compiles every target from this one Linux runner.
      - name: Compile executable
        run: >
          bun build --compile --minify
          --target=${{ matrix.target }}
          ./src/index.ts
          --outfile dist/headless-bot-${{ matrix.name }}${{ matrix.ext }}

      - name: Smoke test (native target only)
        if: matrix.name == 'linux-x64'
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          OVERLAY_PORT=38471 "$GITHUB_WORKSPACE/dist/headless-bot-linux-x64" &
          BOT_PID=$!
          for i in $(seq 1 20); do
            curl -sf -o /dev/null "http://127.0.0.1:38471/" && break || sleep 1
          done
          curl -sf -o /dev/null "http://127.0.0.1:38471/"        || { echo "wheel overlay failed"; exit 1; }
          curl -sf -o /dev/null "http://127.0.0.1:38471/history" || { echo "history page failed"; exit 1; }
          curl -sf -o /dev/null "http://127.0.0.1:38471/api/history" || { echo "history api failed"; exit 1; }
          kill $BOT_PID

      - uses: actions/upload-artifact@v4
        with:
          name: headless-bot-${{ matrix.name }}
          path: dist/headless-bot-${{ matrix.name }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            Standalone executables — no Node.js install needed.

            Put a `.env` next to the binary (see `.env.example`), then run it.
            The bot writes its winner tally to `database.json` in the working
            directory and serves the wheel overlay plus a winner history page
            (`/` and `/history`) on `OVERLAY_PORT` (default 3847).
